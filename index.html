<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Logikascium transforme vos documents, archives et GED en bases de connaissances augmentées par l'IA : OCR, Markdown, RAG, recherche sémantique, workflows et assistants documentaires sourcés.">
  <title>Logikascium – Bases de connaissances augmentées par l'IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.0/css/bootstrap.min.css">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0d1117;
      --ink-soft: #1c2531;
      --paper: #f8f5ef;
      --paper-2: #fffdf8;
      --accent: #b8472d;
      --accent-2: #d28e46;
      --accent-soft: #f5dfc6;
      --muted: #626b79;
      --muted-2: #89919f;
      --border: #e6dfd2;
      --shadow: 0 24px 80px rgba(13, 17, 23, 0.10);
      --shadow-soft: 0 16px 40px rgba(13, 17, 23, 0.07);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.7;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; }
    .container { max-width: 1160px; }

    /* ── LANG SWITCHER ── */
    #notes { background: var(--paper-2); }
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
      margin-top: 2rem;
    }
    .note-card {
      display: block;
      padding: 1.5rem;
      border: 1px solid rgba(13, 17, 23, .12);
      border-radius: 14px;
      background: var(--paper);
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .note-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 10px 24px rgba(13, 17, 23, .08);
    }
    .note-card h4 { margin: 0 0 .4rem; font-weight: 700; }
    .note-card p { margin: 0; opacity: .78; font-size: .95rem; }
    .lang-switcher {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      background: rgba(255,255,255,.55);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: .22rem .3rem;
    }
    .lang-btn {
      padding: .22rem .65rem;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--muted);
      transition: background .18s, color .18s;
    }
    .lang-btn.active {
      background: var(--accent);
      color: #fff;
    }

    .navbar {
      background: rgba(248, 245, 239, 0.86) !important;
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(230, 223, 210, 0.78);
      padding: 0.85rem 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .navbar-brand {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      font-weight: 800;
      color: var(--ink) !important;
      letter-spacing: -0.04em;
      font-size: 1.18rem;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      display: inline-grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #d28e46, #b8472d);
      box-shadow: 0 10px 24px rgba(184,71,45,0.24);
      font-family: 'DM Serif Display', serif;
      font-size: 1.1rem;
    }

    .nav-link {
      color: var(--muted) !important;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      transition: color .2s ease;
    }
    .nav-link:hover, .nav-link.active { color: var(--accent) !important; }

    .navbar-toggler { border: 1px solid var(--border); border-radius: 12px; }
    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%2813,17,23,.8%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    .ambient-photo {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: var(--paper);
    }
    .ambient-photo::before {
      content: '';
      position: absolute;
      inset: -4%;
      background-image: url("images/IMG_20231002_190811.jpg");
      background-size: cover;
      background-position: center 43%;
      background-repeat: no-repeat;
      opacity: 0.56;
      filter: grayscale(22%) sepia(6%) saturate(82%) contrast(74%) brightness(122%) blur(0.7px);
      transform: scale(1.055);
      will-change: transform;
    }
    .ambient-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 78% 3%, rgba(210,142,70,0.18), transparent 30rem),
        radial-gradient(circle at 5% 5%, rgba(184,71,45,0.10), transparent 26rem),
        linear-gradient(180deg,
          rgba(248,245,239,0.76) 0%,
          rgba(248,245,239,0.70) 28%,
          rgba(248,245,239,0.78) 62%,
          rgba(248,245,239,0.88) 100%);
    }
    body > *:not(.ambient-photo) { position: relative; z-index: 1; }

    @media (prefers-reduced-motion: no-preference) {
      .ambient-photo::before {
        animation: ambientPhotoDrift 46s ease-in-out infinite alternate;
      }
      @keyframes ambientPhotoDrift {
        from { transform: scale(1.045) translate3d(-0.7%, -0.4%, 0); }
        to   { transform: scale(1.075) translate3d(0.9%, 0.5%, 0); }
      }
    }

    @media (max-width: 768px) {
      .ambient-photo::before {
        opacity: 0.42;
        background-position: center center;
        filter: grayscale(28%) sepia(6%) saturate(75%) contrast(72%) brightness(124%) blur(0.9px);
      }
      .ambient-photo::after {
        background: linear-gradient(180deg,
          rgba(248,245,239,0.84) 0%,
          rgba(248,245,239,0.78) 50%,
          rgba(248,245,239,0.90) 100%);
      }
    }

    section { padding: 6rem 0; }
    section + section { border-top: 1px solid rgba(230,223,210,0.72); }

    .hero { padding: 6.6rem 0 5.6rem; position: relative; overflow: hidden; }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(320px, .92fr);
      gap: 4rem;
      align-items: center;
    }

    .eyebrow, .section-label {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: 1rem;
      color: var(--accent);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow::before, .section-label::before {
      content: '';
      width: 10px; height: 10px;
      border-radius: 999px;
      background: var(--accent-2);
      box-shadow: 0 0 0 6px rgba(210,142,70,.16);
    }

    h1, h2.section-title, .serif { font-family: 'DM Serif Display', Georgia, serif; letter-spacing: -0.035em; }
    h1 { max-width: 820px; margin: 0 0 1.35rem; font-size: clamp(2.8rem, 7vw, 5.2rem); line-height: .98; }
    h1 em { color: var(--accent); }

    .hero-sub { max-width: 670px; margin: 0 0 2rem; color: var(--muted); font-size: 1.12rem; line-height: 1.75; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: .85rem; margin-bottom: 2.25rem; }

    .btn-primary-custom, .btn-outline-custom, .btn-white, .btn-white-outline {
      display: inline-flex; align-items: center; justify-content: center;
      gap: .5rem; min-height: 48px; padding: .82rem 1.35rem;
      border-radius: 999px; font-size: .9rem; font-weight: 800;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
    }
    .btn-primary-custom { background: var(--accent); color: #fff; box-shadow: 0 16px 34px rgba(184,71,45,.24); }
    .btn-primary-custom:hover { transform: translateY(-2px); color:#fff; background:#963820; }
    .btn-outline-custom { color: var(--ink); background: rgba(255,255,255,.46); border: 1px solid var(--border); }
    .btn-outline-custom:hover { transform: translateY(-2px); color: var(--accent); border-color: rgba(184,71,45,.38); background: #fff; }

    .hero-proof { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8rem; max-width: 700px; }
    .proof-item { padding: .95rem 1rem; background: rgba(255,255,255,.58); border: 1px solid rgba(230,223,210,.9); border-radius: 16px; }
    .proof-item strong { display:block; font-size: 1rem; color: var(--ink); line-height: 1.2; }
    .proof-item span { display:block; color: var(--muted); font-size: .78rem; line-height: 1.45; margin-top: .2rem; }

    .hero-card { position: relative; padding: 1.35rem; background: rgba(255,253,248,.78); border: 1px solid rgba(255,255,255,.7); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; }
    .hero-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(145deg, rgba(210,142,70,.15), transparent 45%); pointer-events: none; }

    .terminal { position: relative; background: #0f1622; border-radius: 22px; color: #c7f6d7; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
    .terminal-top { display: flex; align-items: center; justify-content: space-between; padding: .95rem 1.1rem; border-bottom: 1px solid rgba(255,255,255,.08); color: #7d8796; font-size: .78rem; font-weight: 700; }
    .dots { display:flex; gap:.4rem; }
    .dots span { width: 10px; height: 10px; border-radius: 999px; background: #d28e46; opacity: .8; }
    .terminal-body { padding: 1.35rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: .82rem; line-height: 1.9; }
    .terminal-body .muted { color: #6e7a8e; }
    .terminal-body .accent { color: #1a7c3b; font-weight: 800; }

    .mini-card-grid { position: relative; display: grid; grid-template-columns: repeat(2, 1fr); gap: .85rem; margin-top: .85rem; }
    .mini-card { padding: 1rem; border-radius: 16px; background: rgba(255,255,255,.85); border: 1px solid rgba(230,223,210,.9); }
    .mini-card strong { display:block; font-size: .88rem; margin-bottom: .25rem; }
    .mini-card span { display:block; color: var(--muted); font-size: .76rem; line-height: 1.5; }

    h2.section-title { font-size: clamp(2rem, 4.5vw, 3.25rem); line-height: 1.06; margin: 0 0 1rem; }
    .section-intro { color: var(--muted); max-width: 760px; font-size: 1.06rem; margin-bottom: 0; }

    .term-tooltip { position: relative; display: inline-flex; align-items: baseline; cursor: help; color: var(--accent); font-weight: 800; border-bottom: 2px dotted rgba(184,71,45,.45); text-decoration: none; }
    .term-tooltip::after { content: attr(data-tooltip); position: absolute; left: 50%; bottom: calc(100% + 12px); transform: translateX(-50%) translateY(4px); width: min(430px, 86vw); padding: .95rem 1rem; border-radius: 14px; background: var(--ink); color: var(--paper); font-family: 'Inter', system-ui, sans-serif; font-size: .82rem; font-weight: 500; line-height: 1.55; letter-spacing: 0; box-shadow: var(--shadow); opacity: 0; visibility: hidden; pointer-events: none; z-index: 20; transition: opacity .16s ease, transform .16s ease, visibility .16s ease; }
    .term-tooltip::before { content: ''; position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); border: 8px solid transparent; border-top-color: var(--ink); opacity: 0; visibility: hidden; pointer-events: none; z-index: 21; transition: opacity .16s ease, visibility .16s ease; }
    .term-tooltip:hover::after, .term-tooltip:focus::after, .term-tooltip:hover::before, .term-tooltip:focus::before { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

    .problem-grid, .services-grid, .why-grid, .methode-steps { display: grid; gap: 1.25rem; margin-top: 3rem; }
    .problem-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .services-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .why-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .methode-steps { grid-template-columns: repeat(3, minmax(0,1fr)); counter-reset: step; }

    .problem-card, .service-card, .why-card, .methode-step { position: relative; background: rgba(255,253,248,.72); border: 1px solid rgba(230,223,210,.9); border-radius: var(--radius-md); padding: 1.55rem; box-shadow: 0 1px 0 rgba(255,255,255,.8) inset; transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .problem-card:hover, .service-card:hover, .why-card:hover, .methode-step:hover { transform: translateY(-4px); box-shadow: var(--shadow-soft); border-color: rgba(210,142,70,.40); }

    .icon-badge { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: var(--accent-soft); color: var(--accent); font-weight: 900; margin-bottom: 1rem; }
    .problem-card h4, .service-card h3, .why-card h4, .methode-step h4 { font-size: 1rem; font-weight: 800; margin-bottom: .45rem; letter-spacing: -.02em; }
    .service-card h3 { font-family: 'DM Serif Display', Georgia, serif; font-size: 1.45rem; font-weight: 400; line-height: 1.1; }
    .problem-card p, .service-card p, .why-card p, .methode-step p { color: var(--muted); font-size: .9rem; margin: 0; line-height: 1.65; }
    .service-num { color: var(--accent); font-size: .75rem; font-weight: 900; letter-spacing:.12em; text-transform:uppercase; margin-bottom:.75rem; }

    .pipeline-wrap { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 3rem; align-items: center; margin-top: 3rem; }
    .pipeline { background: #101722; border: 1px solid rgba(255,255,255,.07); border-radius: 24px; padding: 1.35rem; box-shadow: var(--shadow); }
    .pipeline-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; background: #0b111b; color: #b7eec8; border-radius: 18px; padding: 1.35rem; font-size: .86rem; line-height: 1.95; overflow: auto; }
    .pipeline-code .arrow { color: #687386; }
    .pipeline-code .highlight { color: #68e4a4; font-weight: 900; }
    .pipeline-caption { color: #8b98aa; font-size: .78rem; margin: 0 0 .8rem .3rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }

    ul.check-list { list-style: none; padding: 0; margin: 1rem 0 0; }
    ul.check-list li { position: relative; padding-left: 1.65rem; margin: .55rem 0; color: var(--muted); font-size: .92rem; }
    ul.check-list li::before { content: '✓'; position: absolute; left: 0; top: .02rem; color: var(--accent); font-weight: 900; }

    .usecase-list { margin-top: 3rem; border-radius: var(--radius-lg); overflow:hidden; border: 1px solid var(--border); background: rgba(255,253,248,.72); }
    .usecase-item { display: grid; grid-template-columns: 72px 1fr; gap: 1rem; padding: 1.55rem 1.7rem; border-bottom: 1px solid var(--border); }
    .usecase-item:last-child { border-bottom: none; }
    .usecase-num { font-family: 'DM Serif Display', Georgia, serif; font-size: 2.3rem; color: rgba(184,71,45,.24); line-height: 1; }
    .usecase-item h4 { font-weight: 850; margin:0 0 .3rem; }
    .usecase-item p { color: var(--muted); margin:0; font-size:.92rem; }

    .methode-step { counter-increment: step; padding-top: 2.2rem; }
    .methode-step::before { content: counter(step, decimal-leading-zero); position: absolute; top: 1rem; right: 1.1rem; color: rgba(184,71,45,.20); font-family: 'DM Serif Display', Georgia, serif; font-size: 2.35rem; line-height: 1; }

    .tag-cloud { display:flex; flex-wrap:wrap; gap:.45rem; margin-top: 1rem; }
    .tag { display: inline-flex; align-items: center; min-height: 30px; padding: .28rem .7rem; background: rgba(223,242,233,.78); border: 1px solid rgba(184,71,45,.14); color: var(--accent); border-radius: 999px; font-size: .78rem; font-weight: 750; }

    .about-section { background: radial-gradient(circle at 80% 0%, rgba(210,142,70,.24), transparent 30rem), linear-gradient(160deg, #0d1117, #121b26 58%, #0d1117); color: #eef2f7; }
    .about-section .section-intro, .about-section p { color: #a8b1c0; }
    .about-section .section-label { color: #69dba2; }
    .about-section .section-label::before { background:#69dba2; box-shadow:0 0 0 6px rgba(105,219,162,.12); }
    .about-section a { color: #7ee3ae; }

    .about-profile { display: grid; grid-template-columns: 140px 1fr; gap: 2rem; align-items: start; margin-top: 3rem; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.10); border-radius: var(--radius-lg); padding: 2rem; }
    .about-profile img { width: 124px; height: 124px; border-radius: 28px; object-fit: cover; border: 1px solid rgba(255,255,255,.18); box-shadow: 0 20px 50px rgba(0,0,0,.28); }
    .about-profile h3 { font-family: 'DM Serif Display', Georgia, serif; font-size: 2rem; margin:0; }
    .about-profile .role { color: #74dfa8; font-weight: 800; font-size: .92rem; margin: .25rem 0 1rem; }

    .about-achievements { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; margin-top: 1rem; }
    .achievement { background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.10); border-radius: 18px; padding: 1.25rem; }
    .achievement .val { font-family: 'DM Serif Display', Georgia, serif; font-size: 2.2rem; color:#79e2ad; line-height:1; }
    .achievement .lbl { color:#a8b1c0; font-size:.82rem; margin-top:.35rem; }

    .about-columns { display:grid; grid-template-columns: 1fr 1fr; gap: 3rem; margin-top: 3rem; }
    .about-columns h4 { color:#f4f7fb; font-size:1rem; font-weight:850; margin-bottom:1rem; }

    .cta-section { position: relative; overflow: hidden; background: linear-gradient(135deg, #d28e46, #b8472d); color: #fff; text-align: center; padding: 6.3rem 0; }
    .cta-section::before, .cta-section::after { content:''; position:absolute; border-radius:999px; background:rgba(255,255,255,.14); filter: blur(2px); }
    .cta-section::before { width: 360px; height: 360px; left:-140px; top:-120px; }
    .cta-section::after { width: 260px; height: 260px; right:-100px; bottom:-120px; }
    .cta-section .container { position:relative; z-index:1; }
    .cta-section h2 { font-family:'DM Serif Display', Georgia, serif; font-size: clamp(2.1rem, 4.8vw, 4rem); line-height:1.02; margin-bottom:1rem; }
    .cta-section p { max-width: 640px; margin: 0 auto 2rem; color: rgba(255,255,255,.86); font-size:1.08rem; }
    .btn-white { background: #fff; color: var(--accent); }
    .btn-white:hover { color: var(--accent); transform: translateY(-2px); box-shadow: 0 18px 34px rgba(0,0,0,.14); }
    .btn-white-outline { border: 1px solid rgba(255,255,255,.55); color:#fff; background:rgba(255,255,255,.08); }
    .btn-white-outline:hover { color:#fff; border-color:#fff; transform:translateY(-2px); background:rgba(255,255,255,.15); }

    .contact-footer { background:#080b10; color:#99a3b3; padding:3.2rem 0; font-size:.87rem; }
    .contact-footer strong { color:#edf2f7; }
    .contact-footer a { color:#7ee3ae; text-decoration:none; }

    @media (max-width: 991px) {
      .hero-grid, .pipeline-wrap, .about-columns { grid-template-columns: 1fr; }
      .problem-grid, .why-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .services-grid, .methode-steps { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .hero { padding-top: 4.8rem; }
    }
    @media (max-width: 680px) {
      section { padding: 4rem 0; }
      .hero-proof, .problem-grid, .services-grid, .why-grid, .methode-steps, .about-achievements { grid-template-columns: 1fr; }
      .about-profile { grid-template-columns: 1fr; padding: 1.3rem; }
      .usecase-item { grid-template-columns: 1fr; }
      h1 { font-size: clamp(2.55rem, 13vw, 3.7rem); }
    }
  </style>
</head>
<body>
  <div class="ambient-photo" aria-hidden="true"></div>

  <nav class="navbar navbar-expand-lg" aria-label="Navigation principale">
    <div class="container">
      <a class="navbar-brand" href="#"><span class="brand-mark">L</span> Logikascium</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav gap-lg-3 align-items-lg-center">
          <li class="nav-item"><a class="nav-link active" href="#" data-i18n="nav.home"></a></li>
          <li class="nav-item"><a class="nav-link" href="#services" data-i18n="nav.services"></a></li>
          <li class="nav-item"><a class="nav-link" href="#methode" data-i18n="nav.method"></a></li>
          <li class="nav-item"><a class="nav-link" href="#about" data-i18n="nav.about"></a></li>
          <li class="nav-item"><a class="nav-link" href="./notes.html" data-i18n="nav.notes"></a></li>
          <li class="nav-item"><a class="nav-link" href="#contact" data-i18n="nav.contact"></a></li>
          <li class="nav-item ms-lg-2">

  let currentLang = 'fr';

  function detectLang() {
    const saved = localStorage.getItem('logikascium-lang');
    if (saved && i18n[saved]) return saved;
    const browser = (navigator.language || navigator.userLanguage || 'fr').substring(0, 2).toLowerCase();
    return i18n[browser] ? browser : 'fr';
  }

  function setLang(lang) {
    if (!i18n[lang]) return;
    currentLang = lang;
    localStorage.setItem('logikascium-lang', lang);

    const t = i18n[lang];

    // Update html lang attribute
    document.documentElement.lang = t['html.lang'];

    // Update title and meta
    document.title = t['title'];
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute('content', t['meta.desc']);

    // Update text content
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key] !== undefined) el.textContent = t[key];
    });

    // Update HTML content (for links, em, spans inside)
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const key = el.getAttribute('data-i18n-html');
      if (t[key] !== undefined) el.innerHTML = t[key];
    });

    // Update CV link
    const cvLink = document.getElementById('cv-link');
    if (cvLink && t['cv.file']) cvLink.href = t['cv.file'];

    // Update active button
    document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  }

  // Init on load
  setLang(detectLang());
  </script>
