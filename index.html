<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Logikascium prend en charge toute la chaîne de la connaissance : numérisation, curation, organisation, traduction, automatisation, exploitation par l'IA, sécurisation et diffusion, sur le socle ouvert OSIA (Markdown, Git). En développement : Kunereti, la délibération répartie sans serveur central.">
  <title>Logikascium – Chaîne de la connaissance, OSIA et Kunereti</title>
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.logikascium.com/">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="Logikascium – Chaîne de la connaissance, OSIA et Kunereti">
  <meta property="og:description" content="De la numérisation à la transmission : bases de connaissances sur le socle ouvert OSIA, sécurisation des usages d'IA, diffusion. En développement : Kunereti, la délibération répartie sans serveur central.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.0/css/bootstrap.min.css">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* couleurs relevées dans le logo */
      --navy: #022b50;         /* « LOGIKA », couverture du livre */
      --blue: #0064aa;         /* « SCIUM », ton foncé : lisible en petit corps */
      --blue-bright: #0871b9;  /* « SCIUM », ton clair */
      --sky: #9ec3e5;          /* orbites */
      --sky-pale: #e4eef8;
      --orange: #ff980c;       /* circuits et points */
      --orange-soft: #ffdfb0;
      --ember: #e93410;        /* feuillage */
      --slate: #405a6f;        /* signature */

      /* rôles sur fond clair */
      --ink: var(--navy);
      --paper: #f8f5ef;
      --paper-2: #fffdf8;
      --accent: var(--blue);            /* texte et liens : l'orange ne se lit pas sur fond clair */
      --accent-2: var(--orange);        /* points, filets, fonds d'appel */
      --accent-soft: var(--orange-soft);
      --muted: var(--slate);
      --muted-2: #6b8296;
      --border: #e6dfd2;
      --card: rgba(255,253,248,.72);

      /* rôles sur fond sombre : Kunereti, À propos, blocs de code */
      --night: var(--navy);
      --night-deep: #011a31;
      --on-dark: #f1f5fa;
      --on-dark-muted: #b4c4d6;
      --on-dark-accent: #ffaa2e;
      --on-dark-link: var(--sky);
      --card-dark: rgba(255,255,255,.06);
      --border-dark: rgba(158,195,229,.18);
      --shadow: 0 24px 80px rgba(2, 43, 80, 0.12);
      --shadow-soft: 0 16px 40px rgba(2, 43, 80, 0.08);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --serif: 'DM Serif Display', Georgia, serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.7;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; }
    /* marges latérales : 12 px sur mobile, 32 px dès la tablette ; la largeur utile sur grand écran reste de 1136 px */
    .container { max-width: 1200px; padding-left: clamp(.75rem, 3.2vw, 2rem); padding-right: clamp(.75rem, 3.2vw, 2rem); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* ── NAVIGATION ── */
    .lang-switcher {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      background: rgba(255,255,255,.55);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: .22rem .3rem;
    }
    .lang-btn {
      padding: .22rem .65rem;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--muted);
      transition: background .18s, color .18s;
    }
    .lang-btn.active {
      background: var(--ink);
      color: #fff;
    }

    .navbar {
      background: rgba(248, 245, 239, 0.86) !important;
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(230, 223, 210, 0.78);
      padding: 0.35rem 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    /* le logo horizontal porte le nom : pas de texte à côté */
    .navbar-brand { display: inline-flex; align-items: center; padding: 0; }
    .brand-logo { display: block; height: 64px; width: auto; }

    .nav-link {
      color: var(--muted) !important;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      transition: color .2s ease;
    }
    .nav-link:hover, .nav-link.active { color: var(--accent) !important; }

    .navbar-toggler { border: 1px solid var(--border); border-radius: 12px; }
    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba%282,43,80,.85%29' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
    }

    /* ── PHOTO D'AMBIANCE ── */
    .ambient-photo {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: var(--paper);
    }
    .ambient-photo::before {
      content: '';
      position: absolute;
      inset: -4%;
      background-image: url("images/IMG_20231002_190811.jpg");
      background-size: cover;
      background-position: center 43%;
      background-repeat: no-repeat;
      opacity: 0.56;
      filter: grayscale(22%) sepia(6%) saturate(82%) contrast(74%) brightness(122%) blur(0.7px);
      transform: scale(1.055);
      will-change: transform;
    }
    .ambient-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 78% 3%, rgba(255,152,12,0.12), transparent 30rem),
        radial-gradient(circle at 5% 5%, rgba(8,113,185,0.10), transparent 26rem),
        linear-gradient(180deg,
          rgba(248,245,239,0.76) 0%,
          rgba(248,245,239,0.70) 28%,
          rgba(248,245,239,0.78) 62%,
          rgba(248,245,239,0.88) 100%);
    }
    body > *:not(.ambient-photo) { position: relative; z-index: 1; }

    @media (prefers-reduced-motion: no-preference) {
      .ambient-photo::before {
        animation: ambientPhotoDrift 46s ease-in-out infinite alternate;
      }
      @keyframes ambientPhotoDrift {
        from { transform: scale(1.045) translate3d(-0.7%, -0.4%, 0); }
        to   { transform: scale(1.075) translate3d(0.9%, 0.5%, 0); }
      }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }

    @media (max-width: 768px) {
      .ambient-photo::before {
        opacity: 0.42;
        background-position: center center;
        filter: grayscale(28%) sepia(6%) saturate(75%) contrast(72%) brightness(124%) blur(0.9px);
      }
      .ambient-photo::after {
        background: linear-gradient(180deg,
          rgba(248,245,239,0.84) 0%,
          rgba(248,245,239,0.78) 50%,
          rgba(248,245,239,0.90) 100%);
      }
    }

    /* ── SECTIONS ET TITRES ── */
    section { padding: 6rem 0; }
    section[id] { scroll-margin-top: .75rem; }
    section + section { border-top: 1px solid rgba(230,223,210,0.72); }

    .eyebrow, .section-label {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: 1rem;
      color: var(--accent);
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow::before, .section-label::before {
      content: '';
      width: 10px; height: 10px;
      border-radius: 999px;
      background: var(--accent-2);
      box-shadow: 0 0 0 6px rgba(255,152,12,.18);
    }

    h1, h2.section-title, .serif { font-family: var(--serif); letter-spacing: -0.035em; }
    h1 { max-width: 820px; margin: 0 0 1.35rem; font-size: clamp(2.8rem, 7vw, 5.2rem); line-height: .98; }
    h1 em { color: var(--blue-bright); }
    h2.section-title { font-size: clamp(2rem, 4.5vw, 3.25rem); line-height: 1.06; margin: 0 0 1rem; }
    .section-intro { color: var(--muted); max-width: 760px; font-size: 1.06rem; margin-bottom: 0; }

    /* ── HERO ── */
    .hero { padding: 6.6rem 0 5.6rem; position: relative; overflow: hidden; }
    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(320px, .92fr);
      gap: 4rem;
      align-items: center;
    }
    .hero-sub { max-width: 670px; margin: 0 0 2rem; color: var(--muted); font-size: 1.12rem; line-height: 1.75; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: .85rem; margin-bottom: 2.25rem; }

    .btn-primary-custom, .btn-outline-custom, .btn-white, .btn-white-outline {
      display: inline-flex; align-items: center; justify-content: center;
      gap: .5rem; min-height: 48px; padding: .82rem 1.35rem;
      border-radius: 999px; font-size: .9rem; font-weight: 800;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease, border-color .18s ease;
    }
    /* texte bleu nuit sur orange : le blanc n'y atteint pas le contraste requis */
    .btn-primary-custom { background: linear-gradient(135deg, #ffb238, #ff8a00); color: var(--navy); box-shadow: 0 16px 34px rgba(255,138,0,.28); }
    .btn-primary-custom:hover { transform: translateY(-2px); color: var(--navy); background: linear-gradient(135deg, #ffa51a, #f57c00); }
    .btn-outline-custom { color: var(--ink); background: rgba(255,255,255,.46); border: 1px solid var(--border); }
    .btn-outline-custom:hover { transform: translateY(-2px); color: var(--accent); border-color: rgba(0,100,170,.4); background: #fff; }

    .hero-proof { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8rem; max-width: 700px; }
    .proof-item { padding: .95rem 1rem; background: rgba(255,255,255,.58); border: 1px solid rgba(230,223,210,.9); border-radius: 16px; }
    .proof-item strong { display:block; font-size: 1rem; color: var(--ink); line-height: 1.2; }
    .proof-item span { display:block; color: var(--muted); font-size: .78rem; line-height: 1.45; margin-top: .2rem; }

    .hero-card { position: relative; padding: 1.35rem; background: rgba(255,253,248,.78); border: 1px solid rgba(255,255,255,.7); border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; }
    .hero-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(145deg, rgba(255,152,12,.10), transparent 45%); pointer-events: none; }

    .terminal { position: relative; background: var(--night); border-radius: 22px; color: #d7e8f6; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
    .terminal-top { display: flex; align-items: center; justify-content: space-between; padding: .95rem 1.1rem; border-bottom: 1px solid rgba(158,195,229,.16); color: #9db4c8; font-size: .78rem; font-weight: 700; }
    .dots { display:flex; gap:.4rem; }
    .dots span { width: 10px; height: 10px; border-radius: 999px; background: var(--orange); opacity: .9; }
    .terminal-body { padding: 1.35rem; font-family: var(--mono); font-size: .82rem; line-height: 1.9; }
    /* une ligne par maillon ; si elle passe à la ligne, la suite est en retrait comme en YAML */
    .terminal-body .ln { display: block; padding-left: 2.4ch; text-indent: -2.4ch; }
    .terminal-body .muted { color: #9db4c8; }
    .terminal-body .accent { color: var(--on-dark-accent); font-weight: 800; }

    .mini-card-grid { position: relative; display: grid; grid-template-columns: repeat(2, 1fr); gap: .85rem; margin-top: .85rem; }
    .mini-card { padding: 1rem; border-radius: 16px; background: rgba(255,255,255,.85); border: 1px solid rgba(230,223,210,.9); }
    .mini-card strong { display:block; font-size: .88rem; margin-bottom: .25rem; }
    .mini-card span { display:block; color: var(--muted); font-size: .76rem; line-height: 1.5; }

    /* ── CARTES ── */
    .problem-grid, .why-grid, .methode-steps { display: grid; gap: 1.25rem; margin-top: 3rem; }
    .problem-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .why-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .methode-steps { grid-template-columns: repeat(3, minmax(0,1fr)); counter-reset: step; }

    .problem-card, .why-card, .methode-step, .chain-card { position: relative; background: var(--card); border: 1px solid rgba(230,223,210,.9); border-radius: var(--radius-md); padding: 1.55rem; box-shadow: 0 1px 0 rgba(255,255,255,.8) inset; }
    .problem-card, .why-card, .methode-step { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
    .problem-card:hover, .why-card:hover, .methode-step:hover { transform: translateY(-4px); box-shadow: var(--shadow-soft); border-color: rgba(255,152,12,.55); }

    .problem-card h3, .why-card h3, .methode-step h3 { font-size: 1rem; font-weight: 800; margin: 0 0 .45rem; letter-spacing: -.02em; }
    .problem-card p, .why-card p, .methode-step p { color: var(--muted); font-size: .9rem; margin: 0; line-height: 1.65; }
    /* le constat n'est pas une suite d'étapes : un filet, pas de numéro */
    .problem-card::before { content: ''; display: block; width: 28px; height: 3px; border-radius: 2px; background: var(--accent-2); margin-bottom: 1rem; }

    .methode-step { counter-increment: step; padding-top: 2.2rem; }
    .methode-step::before { content: counter(step, decimal-leading-zero); position: absolute; top: 1rem; right: 1.1rem; color: rgba(0,100,170,.18); font-family: var(--serif); font-size: 2.35rem; line-height: 1; }

    ul.check-list { list-style: none; padding: 0; margin: 1rem 0 0; }
    ul.check-list li { position: relative; padding-left: 1.65rem; margin: .55rem 0; color: var(--muted); font-size: .92rem; }
    ul.check-list li::before { content: '✓'; position: absolute; left: 0; top: .02rem; color: var(--ember); font-weight: 900; }

    .tag-cloud { display:flex; flex-wrap:wrap; gap:.45rem; margin-top: 1rem; }
    .tag { display: inline-flex; align-items: center; min-height: 30px; padding: .28rem .7rem; background: var(--sky-pale); border: 1px solid rgba(0,100,170,.16); color: var(--accent); border-radius: 999px; font-size: .78rem; font-weight: 750; }

    .chip { display: inline-flex; align-items: center; min-height: 26px; padding: .12rem .65rem; border-radius: 999px; font-size: .74rem; font-weight: 750; line-height: 1.3; }
    .chip-brick { background: var(--ink); color: var(--paper); }
    .chip-status { background: var(--accent-soft); color: var(--ink); }
    .chip-soon { border: 1px dashed var(--muted-2); color: var(--muted); }
    .text-link { color: var(--accent); font-size: .84rem; font-weight: 700; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .text-link:hover { color: var(--ink); }

    /* ── LA CHAÎNE : six maillons reliés par un fil, à la manière des circuits du logo ── */
    .chain-wrap { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.2fr); gap: 4rem; align-items: start; }
    .chain-intro { position: sticky; top: 6.2rem; }
    .chain-intro .section-intro { margin-bottom: 1.75rem; }

    .chain { --node: 52px; --node-top: .5rem; --gap: 1.1rem; list-style: none; margin: 0; padding: 0; display: grid; gap: var(--gap); counter-reset: maillon; }
    .chain-item { position: relative; display: grid; grid-template-columns: var(--node) minmax(0, 1fr); column-gap: 1.15rem; align-items: start; counter-increment: maillon; }
    /* le fil part sous un nœud et s'arrête au-dessus du suivant */
    .chain-item:not(:last-child)::before {
      content: '';
      position: absolute;
      left: calc(var(--node) / 2 - 1px);
      top: calc(var(--node-top) + var(--node) + 8px);
      bottom: calc(8px - var(--gap) - var(--node-top));
      width: 2px;
      border-radius: 2px;
      background: rgba(255,152,12,.6);
    }
    .chain-item.leads-to-soon::before { background: repeating-linear-gradient(to bottom, rgba(107,130,150,.75) 0 5px, transparent 5px 11px); }
    .chain-node {
      width: var(--node); height: var(--node); margin-top: var(--node-top);
      display: grid; place-items: center;
      border-radius: 50%;
      background: var(--paper-2);
      border: 2px solid var(--orange);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 1.4rem;
      line-height: 1;
    }
    .chain-node::before { content: counter(maillon); }
    .chain-card { padding: 1.35rem 1.5rem 1.4rem; }
    .chain-card h3 { font-family: var(--serif); font-size: 1.55rem; font-weight: 400; line-height: 1.1; letter-spacing: -.02em; margin: 0 0 .3rem; }
    .chain-lead { margin: 0 0 .5rem; color: var(--ink); font-size: .95rem; font-weight: 700; line-height: 1.5; }
    .chain-desc { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.65; }
    .chain-meta { display: flex; flex-wrap: wrap; align-items: center; gap: .45rem .65rem; margin: .95rem 0 0; }
    /* le maillon à venir : même forme, en pointillé */
    .chain-item.is-soon .chain-node { border-style: dashed; border-color: var(--muted-2); color: var(--muted); }
    .chain-item.is-soon .chain-card { border-style: dashed; border-color: rgba(107,130,150,.55); background: rgba(255,253,248,.5); }

    /* ── BLOCS SOMBRES : pile OSIA, fichier Kunereti ── */
    .pipeline-wrap { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 3rem; align-items: center; margin-top: 3rem; }
    .pipeline { background: var(--night); border: 1px solid rgba(158,195,229,.16); border-radius: 24px; padding: 1.35rem; box-shadow: var(--shadow); }
    .pipeline-code { font-family: var(--mono); background: var(--night-deep); color: #d7e8f6; border-radius: 18px; padding: 1.35rem; font-size: .82rem; line-height: 1.85; overflow: auto; }
    /* le fichier ne doit jamais élargir la page : sur un écran très étroit, une ligne se replie */
    pre.pipeline-code { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .pipeline-code .k { color: #8ba6bb; }
    .pipeline-code .highlight { color: var(--on-dark-accent); font-weight: 800; }
    .pipeline-caption { color: #9db4c8; font-size: .78rem; margin: 0 0 .8rem .3rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
    .pipeline-caption.is-path { font-family: var(--mono); font-weight: 600; letter-spacing: 0; text-transform: none; }
    .pipeline-note { color: #9db4c8; font-size: .82rem; line-height: 1.55; margin: .9rem .3rem 0; }

    .stack { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }
    .stack li { display: grid; grid-template-columns: 1.4rem minmax(0, .85fr) minmax(0, 1.15fr); column-gap: .75rem; align-items: baseline; padding: .78rem 1rem; border-radius: 12px; background: var(--night-deep); border: 1px solid rgba(158,195,229,.12); }
    .stack-n { font-family: var(--serif); font-size: 1.05rem; color: #8ba6bb; }
    .stack-name { color: var(--on-dark); font-size: .92rem; font-weight: 750; }
    .stack-what { color: #9db4c8; font-size: .82rem; line-height: 1.45; }
    /* la couche du bas porte tout le reste */
    .stack li.is-base { border-color: rgba(255,170,46,.6); }
    .stack li.is-base .stack-n, .stack li.is-base .stack-name { color: var(--on-dark-accent); }

    .osia-side > p { color: var(--muted); font-size: 1rem; margin: 0; }
    .osia-course { margin-top: 1.6rem; padding-top: 1.4rem; border-top: 1px solid var(--border); }
    .osia-course p { color: var(--muted); font-size: .92rem; margin: 0 0 1rem; }

    /* ── SECTIONS SOMBRES ── */
    .dark-section { background: radial-gradient(circle at 80% 0%, rgba(8,113,185,.40), transparent 32rem), linear-gradient(160deg, #011f3d, var(--night) 58%, #011f3d); color: var(--on-dark); }
    .dark-section .section-intro, .dark-section p { color: var(--on-dark-muted); }
    .dark-section .section-label { color: var(--on-dark-accent); }
    .dark-section .section-label::before { background: var(--on-dark-accent); box-shadow: 0 0 0 6px rgba(255,170,46,.16); }
    .dark-section a { color: var(--on-dark-link); }
    .dark-section ul.check-list li { color: var(--on-dark-muted); }
    .dark-section ul.check-list li::before { color: var(--on-dark-accent); }
    .dark-section :focus-visible { outline-color: var(--on-dark-accent); }
    /* sur le bleu nuit de la section, un panneau du même bleu ne se détacherait pas */
    .dark-section .pipeline { background: rgba(1,26,49,.55); box-shadow: none; }

    .btn-white { background: #fff; color: var(--ink); }
    .btn-white:hover { color: var(--ink); transform: translateY(-2px); box-shadow: 0 18px 34px rgba(0,0,0,.14); }
    .btn-white-outline { border: 1px solid rgba(255,255,255,.55); color:#fff; background:rgba(255,255,255,.08); }
    .btn-white-outline:hover { color:#fff; border-color:#fff; transform:translateY(-2px); background:rgba(255,255,255,.15); }
    .dark-section a.btn-white, .dark-section a.btn-white:hover { color: var(--ink); }

  let currentLang = 'fr';

  function detectLang() {
    const saved = localStorage.getItem('logikascium-lang');
    if (saved && i18n[saved]) return saved;
    const browser = (navigator.language || navigator.userLanguage || 'fr').substring(0, 2).toLowerCase();
    return i18n[browser] ? browser : 'fr';
  }

  function setLang(lang) {
    if (!i18n[lang]) return;
    currentLang = lang;
    localStorage.setItem('logikascium-lang', lang);

    const t = i18n[lang];

    // Update html lang attribute
    document.documentElement.lang = t['html.lang'];

    // Update title and meta
    document.title = t['title'];
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute('content', t['meta.desc']);

    // Update text content
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key] !== undefined) el.textContent = t[key];
    });

    // Update HTML content (for links, em, spans inside)
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const key = el.getAttribute('data-i18n-html');
      if (t[key] !== undefined) el.innerHTML = t[key];
    });

    // Update CV link
    const cvLink = document.getElementById('cv-link');
    if (cvLink && t['cv.file']) cvLink.href = t['cv.file'];

    // Update active button
    document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  }

  // Init on load
  setLang(detectLang());
  </script>
